name: Release ZIP

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crea ZIP
        run: |
          zip -r esn-toolkit-${{ github.ref_name }}.zip . \
            --exclude "*.git*" \
            --exclude "*.md" \
            --exclude ".github/*" \
            --exclude "*.yml"

      - name: Allega ZIP alla release
        uses: softprops/action-gh-release@v2
        with:
          files: esn-toolkit-${{ github.ref_name }}.zip
