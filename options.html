<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>ESN Toolkit - Opzioni</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ESN Visual Identity Manual colours */
    :root {
      --esn-dark-blue:       #2e3192;
      --esn-dark-blue-hover: #252774;
      --esn-green:           #7ac143;
      --esn-magenta:         #ec008c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #f8fafc;
      color: #1e293b;
      padding: 24px;
      max-width: 600px;
    }
    h1 { font-size: 20px; color: var(--esn-dark-blue); margin-bottom: 20px; }
    h2 { font-size: 15px; color: #1e293b; margin-bottom: 10px; }
    .section { margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    textarea {
      width: 100%;
      height: 200px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      resize: vertical;
      background: #fff;
    }
    textarea:focus { outline: none; border-color: var(--esn-dark-blue); }
    .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-right: 8px;
    }
    .btn-primary { background: var(--esn-dark-blue); color: #fff; }
    .btn-primary:hover { background: var(--esn-dark-blue-hover); }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; }
    .status { font-size: 12px; margin-top: 8px; min-height: 16px; }
    .status.ok    { color: var(--esn-green); }
    .status.error { color: var(--esn-magenta); }
    .credits {
      margin-top: 30px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      color: #64748b;
      font-size: 12px;
    }
    .credits h2 { margin-bottom: 8px; color: #374151; }
    .credits p { margin: 6px 0; }
    .credits a { color: var(--esn-dark-blue); }
  </style>
</head>
<body>
  <h1>⚙ ESN Toolkit - Opzioni</h1>

  <div class="section">
    <h2>Sezioni ESN</h2>
    <label for="sectionsInput">Codici sezione (uno per riga)</label>
    <textarea id="sectionsInput" placeholder="IT-PISA-ESN
IT-BARI-ESN
IT-BOLO-ESN"></textarea>
    <p class="hint">Inserisci i codici sezione nel formato IT-XXXX-XXX, uno per riga.</p>
  </div>

  <button class="btn btn-primary" id="btnSave">Salva</button>
  <button class="btn btn-secondary" id="btnReset">Ripristina default</button>
  <div class="status" id="saveStatus"></div>

  <section class="credits">
    <h2>Credits</h2>
    <p><strong>ESN Toolkit v2.0.2</strong></p>
    <p>Sviluppato da <a id="creditsLink" href="https://github.com/francescocopelli">Francesco Copelli</a> per ESN Italia.</p>
    <p>Strumento indipendente e non ufficiale.</p>
    <p><a id="githubLink" href="https://github.com/francescocopelli/esn-toolkit">Repository GitHub</a></p>
  </section>

  <script src="options.js"></script>
</body>
</html>
